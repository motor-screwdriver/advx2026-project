name: Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: 1
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  # Optional: set when a real domain replaces the sslip.io one.
  DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Baked into the native build so the app reaches the deployed Go backend.
      - name: Resolve API origin
        run: echo "EXPO_PUBLIC_API_ORIGIN=https://${DEPLOY_DOMAIN:-${DEPLOY_HOST}.sslip.io}" >> "$GITHUB_ENV"
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"
      - name: Sync version
        run: |
          node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = version;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          EOF
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --non-interactive
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v5
        with:
          name: android-apk-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
